# Tiny Tapeout project information
project:
  title:        "Spänningmätningtilldisplaychip"      # Project title
  author:       "NoName"      # Your name
  discord:      "KURENANI"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A Chip that measures the input and then displays it on a screen"      # One line description of what your project does
  language:     "VHDL"  # other examples include Verilog, SystemVerilog, Amaranth, etc
  clock_hz:     10e5       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_SignalType"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  #
  # WARNING: VHDL support in Tiny Tapeout is experimental. The template may get changes during
  #          the shuttle and VHDL support may be dropped for future shuttles if we see low usage.
  source_files:
    - "project.vhdl"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "first bit of input"
  ui[1]: "last bit of input"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "first bit Output to the first 7 segment display"
  uo[1]: "Inbetween"
  uo[2]: "Inbetween"
  uo[3]: "Inbetween"
  uo[4]: "Inbetween"
  uo[5]: "Inbetween"
  uo[6]: "Inbetween"
  uo[7]: "last bit Output to 7 segment display"

  # Bidirectional pins
  uio[0]: "first bit Output to the second 7 segment display"
  uio[1]: "Inbetween"
  uio[2]: "Inbetween"
  uio[3]: "Inbetween"
  uio[4]: "Inbetween"
  uio[5]: "Inbetween"
  uio[6]: "Inbetween"
  uio[7]: "last bit Output to the second 7 segment display"

# Do not change!
yaml_version: 6
